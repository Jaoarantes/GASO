<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      var raiz = document.documentElement;
      raiz.setAttribute("data-theme", localStorage.getItem("tema") || "light");
      raiz.setAttribute("data-sidebar", localStorage.getItem("sidebarColapsada") === "true" ? "colapsada" : "expandida");
    })();
  </script>
  <title>Estrutura de Tabelas | GASO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/img/favicon.ico">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="visibility: hidden">
  <nav class="sidebar">
    <div class="sidebar__topo">
      <a class="sidebar__logo-link" href="index.html"><img class="sidebar__logo" src="assets/img/logo-claro.svg" alt="Gasometro"></a>
      <button class="sidebar__colapsar" type="button" id="sidebar-colapsar" aria-label="Recolher menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>

    <div class="sidebar__menu">
      <a class="sidebar__link" href="index.html">
        <svg class="sidebar__link-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5c0-1.1.9-2 2-2h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H3z"/><path d="M21 5c0-1.1-.9-2-2-2h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h8z"/></svg>
        <span class="sidebar__link-texto">Início</span>
      </a>
      <a class="sidebar__link" href="nova-solucao.html">
        <svg class="sidebar__link-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.8 2.8-2.6-2.6z"/></svg>
        <span class="sidebar__link-texto">Nova Solução</span>
      </a>
      <a class="sidebar__link" href="novo-sql.html">
        <svg class="sidebar__link-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3"/><path d="M13 15h4"/></svg>
        <span class="sidebar__link-texto">Novo SQL</span>
      </a>
      <a class="sidebar__link sidebar__link--ativo" href="sql.html">
        <svg class="sidebar__link-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="12" height="8" rx="1.5"/><rect x="3" y="13" width="12" height="8" rx="1.5"/><path d="M7 7h4M7 17h4"/><circle cx="18" cy="16" r="3.2"/><path d="M20.4 18.4L23 21"/></svg>
        <span class="sidebar__link-texto">Estrutura de Tabelas</span>
      </a>
      <a class="sidebar__link" href="chat.html">
        <svg class="sidebar__link-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-4 4v-4H6a2 2 0 0 1-2-2z"/><circle cx="9" cy="9.5" r="0.6" fill="currentColor" stroke="none"/><circle cx="12" cy="9.5" r="0.6" fill="currentColor" stroke="none"/><circle cx="15" cy="9.5" r="0.6" fill="currentColor" stroke="none"/></svg>
        <span class="sidebar__link-texto">Chat</span>
      </a>
    </div>

    <div class="sidebar__rodape">
      <button class="sidebar__tema" type="button" id="tema-toggle">
        <svg class="sidebar__link-icone" id="tema-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span id="tema-texto">Tema escuro</span>
      </button>
    </div>
  </nav>

  <header class="header"><p class="text-header">Estrutura de Tabelas</p></header>

  <main class="conteudo">
    <div class="busca-secao">
      <p class="busca-contagem" id="busca-contagem"></p>

      <div class="busca-linha">
        <div class="busca-barra">
          <svg class="busca-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input class="busca-input" type="text" id="busca-input" placeholder="Busque por termos, ex: notas, pedidos...">
        </div>

        <div class="modo-busca-grupo">
          <button class="modo-busca-btn" type="button" id="modo-tabela" data-modo="tabela">Tabela</button>
          <button class="modo-busca-btn modo-busca-btn--ativo" type="button" id="modo-termos" data-modo="termos">Termos</button>
        </div>
      </div>

      <div class="filtros-barra">
        <select class="filtro-select" id="filtro-modulo">
          <option value="">Módulo</option>
        </select>
        <select class="filtro-select" id="filtro-tipo">
          <option value="">Tipo</option>
        </select>
      </div>

      <div class="favoritas-secao" id="favoritas-secao" hidden>
        <span class="favoritas-secao__titulo">Tabelas favoritas</span>
        <div class="solucoes-grade" id="favoritas-grade"></div>
      </div>

      <div class="busca-divisor"></div>

      <p class="solucoes-vazio" id="tabelas-vazio" hidden></p>
      <div class="solucoes-grade" id="tabelas-grade"></div>
    </div>
  </main>

  <div class="painel-overlay" id="painel-overlay" hidden>
    <aside class="painel painel--tabela" id="painel">
      <div class="painel__topo">
        <div class="painel__topo-selos">
          <span class="tipo-pill" id="painel-tipo"></span>
          <h2 class="painel__titulo-tabela" id="painel-tabela-nome"></h2>
        </div>
        <div class="painel__topo-acoes">
          <button class="painel__icone-btn" type="button" id="painel-fechar" aria-label="Fechar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>

      <div class="painel__corpo" id="painel-corpo">
        <div class="busca-barra colunas-busca-barra">
          <svg class="busca-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input class="busca-input" type="text" id="coluna-busca-input" placeholder="Busque por coluna ou descrição...">
        </div>

        <div class="colunas-tabela-wrapper">
          <table class="colunas-tabela">
            <thead>
              <tr>
                <th class="coluna-th-ordenavel" data-campo="coluna">Coluna <span class="coluna-ordem-seta" data-campo="coluna"></span></th>
                <th class="coluna-th-ordenavel" data-campo="tipo">Tipo <span class="coluna-ordem-seta" data-campo="tipo"></span></th>
                <th class="coluna-th-ordenavel" data-campo="tamanho">Tamanho <span class="coluna-ordem-seta" data-campo="tamanho"></span></th>
                <th class="coluna-th-ordenavel" data-campo="descricao">Descrição de negócio <span class="coluna-ordem-seta" data-campo="descricao"></span></th>
              </tr>
            </thead>
            <tbody id="colunas-tabela-corpo"></tbody>
          </table>
        </div>
      </div>
    </aside>
  </div>

  <div class="painel-overlay painel-overlay--centralizado" id="favorita-confirmar-overlay" hidden>
    <div class="confirmar-modal">
      <h3 class="confirmar-modal__titulo">Remover dos favoritos</h3>
      <p class="confirmar-modal__texto" id="favorita-confirmar-texto"></p>
      <div class="confirmar-modal__acoes">
        <button class="confirmar-modal__cancelar" type="button" id="favorita-confirmar-cancelar">Cancelar</button>
        <button class="confirmar-modal__confirmar" type="button" id="favorita-confirmar-remover">Remover</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/auth-guard.js"></script>
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/pages/sql.js"></script>
</body>
</html>
