<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Solução</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="visibility: hidden">
  <header class="navbar">
    <a class="navbar__logo" href="index.html">
      <img src="assets/img/logo-claro.svg" alt="Gasometro">
    </a>

    <nav class="navbar__nav">
      <a class="navbar__link" href="solucoes.html">Soluções</a>
      <a class="navbar__link navbar__link--active" href="nova-solucao.html">Nova Solução</a>
      <a class="navbar__link" href="sql.html">SQL</a>
    </nav>
  </header>

  <main class="page">
    <form class="form-card" id="nova-solucao-form" novalidate>
      <h1 class="page__title">Nova Solução</h1>

      <div class="form-group">
        <label class="form-label" for="titulo">Título</label>
        <input class="form-input" type="text" id="titulo" name="titulo" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="autor">Autor</label>
        <input class="form-input" type="text" id="autor" name="autor" required>
      </div>

      <div class="form-group form-group--full">
        <label class="form-label" for="erro">Erro</label>
        <textarea class="form-textarea" id="erro" name="erro" rows="3" required></textarea>
      </div>

      <div class="form-group form-group--full">
        <label class="form-label">Passo a passo</label>
        <div class="passos" id="passos-container">
          <button class="btn-secundario" type="button" id="add-passo">+ Adicionar passo</button>
        </div>
      </div>

      <div class="form-group form-group--full">
        <label class="form-label">Anexar arquivos</label>
        <div class="anexos">
          <button class="btn-secundario" type="button" id="anexos-btn">Escolher arquivos</button>
          <p class="anexos__lista" id="anexos-lista">Nenhum arquivo selecionado</p>
          <input class="form-file" type="file" id="anexos" name="anexos" multiple hidden>
        </div>
      </div>

      <p class="form-status" id="form-status"></p>

      <button class="form-btn" type="submit" id="form-submit">Salvar solução</button>
    </form>
  </main>

  <script type="module" src="js/auth-guard.js"></script>
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/nova-solucao.js"></script>
</body>
</html>
