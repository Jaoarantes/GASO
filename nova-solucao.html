<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Solução | GASO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/img/favicon.ico">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
</head>
<body style="visibility: hidden">
  <nav class="sidebar">
    <div class="sidebar__topo">
      <a href="index.html"><img class="sidebar__logo" src="assets/img/logo-claro.svg" alt="Gasometro"></a>
    </div>

    <div class="sidebar__menu">
      <a class="sidebar__link" href="index.html">
        <svg class="sidebar__link-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
        Início
      </a>
      <a class="sidebar__link sidebar__link--ativo" href="nova-solucao.html">
        <svg class="sidebar__link-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M12 12v6M9 15h6"/></svg>
        Nova Solução
      </a>
      <a class="sidebar__link" href="sql.html">
        <svg class="sidebar__link-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
        SQL
      </a>
      <a class="sidebar__link" href="favoritos.html">
        <svg class="sidebar__link-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.2.9-4.5 4.4 1.1 6.1L12 17l-5.5 3 1.1-6.1L3.1 9.5l6.2-.9z"/></svg>
        Favoritos
      </a>
    </div>

    <div class="sidebar__rodape">
      <button class="sidebar__tema" type="button" id="tema-toggle">
        <svg class="sidebar__link-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span id="tema-texto">Tema escuro</span>
      </button>
    </div>
  </nav>

  <header class="header">
    <p class="text-header">Nova Solução</p>
  </header>

  <main class="conteudo">
    <div class="registro-layout">
      <div class="registro-esquerda">
        <div class="registro-secao-titulo">
          <span class="registro-secao-titulo__texto">TIPO DE REGISTRO</span>
          <span class="registro-secao-titulo__ajuda">define os campos abaixo</span>
        </div>

        <div class="tipo-cards">
          <button class="tipo-card" type="button" data-tipo="erro">
            <span class="tipo-card__icone tipo-card__icone--erro">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
            </span>
            <span class="tipo-card__titulo">Erro / Correção</span>
            <span class="tipo-card__descricao">Um problema do ERP e como resolver</span>
          </button>

          <button class="tipo-card" type="button" data-tipo="script">
            <span class="tipo-card__icone tipo-card__icone--script">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            </span>
            <span class="tipo-card__titulo">Script / SQL</span>
            <span class="tipo-card__descricao">Consulta ou rotina reutilizável</span>
          </button>
        </div>

        <div class="registro-vazio" id="registro-vazio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
          <span>Escolha um tipo para abrir os campos do registro.</span>
        </div>

        <div class="registro-campos" id="registro-campos" hidden></div>
      </div>

      <aside class="registro-direita">
        <div class="publicacao-cabecalho">
          <span class="publicacao-titulo">PUBLICAÇÃO</span>
        </div>

        <div class="publicacao-divisor"></div>

        <div class="publicacao-campo">
          <label class="publicacao-label">Módulo do ERP</label>
          <div class="publicacao-campo-linha">
            <select class="publicacao-select" id="modulo-select">
              <option>Faturamento</option>
            </select>
            <button class="publicacao-add" type="button" id="modulo-add-btn" aria-label="Adicionar módulo">+</button>
          </div>
          <div class="publicacao-novo-item" id="modulo-novo-form" hidden>
            <input class="publicacao-select" type="text" id="modulo-novo-input" placeholder="Nome do novo módulo">
            <button class="btn-secundario-pequeno" type="button" id="modulo-novo-confirmar">Adicionar</button>
            <button class="btn-secundario-pequeno" type="button" id="modulo-novo-cancelar">Cancelar</button>
          </div>
        </div>

        <div class="publicacao-campo">
          <label class="publicacao-label">Categoria</label>
          <div class="publicacao-campo-linha">
            <select class="publicacao-select" id="categoria-select">
              <option>Faturamento / NF-e</option>
            </select>
            <button class="publicacao-add" type="button" id="categoria-add-btn" aria-label="Adicionar categoria">+</button>
          </div>
          <div class="publicacao-novo-item" id="categoria-novo-form" hidden>
            <input class="publicacao-select" type="text" id="categoria-novo-input" placeholder="Nome da nova categoria">
            <button class="btn-secundario-pequeno" type="button" id="categoria-novo-confirmar">Adicionar</button>
            <button class="btn-secundario-pequeno" type="button" id="categoria-novo-cancelar">Cancelar</button>
          </div>
        </div>

        <div class="publicacao-campo">
          <label class="publicacao-label">Criticidade</label>
          <div class="criticidade-grupo">
            <button class="criticidade-btn criticidade-btn--baixa" data-criticidade="baixa" type="button">Baixa</button>
            <button class="criticidade-btn criticidade-btn--media" data-criticidade="media" type="button">Média</button>
            <button class="criticidade-btn criticidade-btn--alta criticidade-btn--ativo" data-criticidade="alta" type="button">Alta</button>
            <button class="criticidade-btn criticidade-btn--critica" data-criticidade="critica" type="button">Crítica</button>
          </div>
        </div>

        <div class="publicacao-campo">
          <label class="publicacao-label">Autor</label>
          <input class="publicacao-input" type="text" id="autor-input" placeholder="Nome de quem resolveu">
        </div>

        <div class="publicacao-divisor"></div>

        <p class="publicacao-erro" id="publicacao-erro"></p>

        <button class="publicacao-btn publicacao-btn--principal" type="button" id="salvar-btn">Salvar</button>
      </aside>
    </div>
  </main>

  <script type="module" src="js/auth-guard.js"></script>
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/nova-solucao.js"></script>
</body>
</html>
